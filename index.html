<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio web – ADS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Portafolio web</h1>
    <nav>
      <a href="#proyectos">Proyectos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>
  <main>
    <section id="proyectos">
      <h2>Proyectos</h2>
      <p>Repositorio de práctica de control de versiones con Git y GitHub.</p>
      <button id="btn-tema">Cambiar tema</button>
    </section>
    <!-- Sección agregada en la rama feature/contacto -->
    <section id="contacto">
      <h2>Contacto</h2>
      <form>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo">
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>
  <footer><p>Universidad Don Bosco – Análisis y diseño de sistemas</p></footer>
  <script src="js/main.js"></script>
</body>
</html>
